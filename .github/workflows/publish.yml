name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  resolve:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # renovate: datasource=github-releases depName=oven-sh/bun
          bun-version: "1.3.14"
          no-cache: true
      - name: Resolve release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bun scripts/release-tag.ts resolve "$RELEASE_TAG" "$RELEASE_SHA"
          {
            echo "tag=$RELEASE_TAG"
            echo "sha=$RELEASE_SHA"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # renovate: datasource=github-releases depName=oven-sh/bun
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Resolve npm dist-tag from version
        id: disttag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: bun publish --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.disttag.outputs.tag }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
